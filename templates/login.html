<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Gestion Boutique</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center}
.login-card{max-width:400px;width:100%;margin:auto}</style>
</head>
<body>
<div class="container px-3">
  <div class="card login-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-shop display-4 text-primary"></i>
        <h4 class="fw-bold mt-2">DD Design</h4>
        <p class="text-muted small">Friperie & Prêt-à-porter</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" name="username" class="form-control form-control-lg" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Mot de passe</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <button class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
      </form>
      <p class="text-muted small text-center mt-3 mb-0">Par défaut : <code>admin / admin123</code></p>
    </div>
  </div>
</div>
</body>
</html>
