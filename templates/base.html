<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% from "_nav.html" import nav_links %}
{% block title %}Gestion Boutique{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Navbar mobile -->
<nav class="navbar navbar-dark bg-dark d-lg-none sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold"><i class="bi bi-shop"></i> DD Design</span>
    <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#menuMobile">
      <i class="bi bi-list fs-4"></i>
    </button>
  </div>
</nav>

<!-- Sidebar desktop -->
<div class="sidebar d-none d-lg-flex flex-column bg-dark text-white p-3">
  <h5 class="fw-bold mb-4"><i class="bi bi-shop"></i> DD Design</h5>
  {{ nav_links() }}
</div>

<!-- Menu mobile (offcanvas) -->
<div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuMobile">
  <div class="offcanvas-header">
    <h5 class="fw-bold"><i class="bi bi-shop"></i> DD Design</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    {{ nav_links() }}
  </div>
</div>

<!-- Contenu principal -->
<div class="main-content">
  <div class="container-fluid py-3 py-lg-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
